<!doctype html><!-- seolgye-app --><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#FAF7FF}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>설계노트</title>
<style>
/* Layout: tablet-first app shell — icon rail + working area, Claude drawer slides in from the right; stacks to one column with a bottom bar on phones. */
:root {
  --bg: #FAF7FF;
  --surface: #FFFFFF;
  --sunken: #F3EFFA;
  --line: #ECE6F7;
  --ink: #2E2A47;
  --ink-2: #4A4466;
  --muted: #6E6889;
  --faint: #A39DBF;
  --lav: #C9B8FF;
  --lav-soft: #F0EBFF;
  --lav-ink: #5E48C0;
  --pink: #FFD6E3;
  --pink-soft: #FFE7ED;
  --pink-ink: #B03E62;
  --mint: #A8E0CC;
  --mint-soft: #E2F6EE;
  --mint-ink: #2F7A5F;
  --butter: #FFCB7A;
  --butter-soft: #FFF2D9;
  --butter-ink: #7A4A06;
  --scrim: rgba(46, 42, 71, .35);
  --shadow: 0 20px 60px rgba(46, 42, 71, .16);
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17151F; --surface: #211E2C; --sunken: #2A2638; --line: #37324A;
    --ink: #F1EEFA; --ink-2: #D6D0EA; --muted: #A9A2C4; --faint: #7C7596;
    --lav: #9D88F0; --lav-soft: #2F2847; --lav-ink: #CFC3FF;
    --pink: #5A2E42; --pink-soft: #3A2230; --pink-ink: #FFB3C8;
    --mint: #3C7A64; --mint-soft: #1E3530; --mint-ink: #9EE3C7;
    --butter: #B98A3A; --butter-soft: #3A2F1C; --butter-ink: #FFD99A;
    --scrim: rgba(0, 0, 0, .55); --shadow: 0 20px 60px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17151F; --surface: #211E2C; --sunken: #2A2638; --line: #37324A;
  --ink: #F1EEFA; --ink-2: #D6D0EA; --muted: #A9A2C4; --faint: #7C7596;
  --lav: #9D88F0; --lav-soft: #2F2847; --lav-ink: #CFC3FF;
  --pink: #5A2E42; --pink-soft: #3A2230; --pink-ink: #FFB3C8;
  --mint: #3C7A64; --mint-soft: #1E3530; --mint-ink: #9EE3C7;
  --butter: #B98A3A; --butter-soft: #3A2F1C; --butter-ink: #FFD99A;
  --scrim: rgba(0, 0, 0, .55); --shadow: 0 20px 60px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--lav); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.app { display: flex; height: 100%; }
.rail { width: 88px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 0; }
.logo { font-weight: 800; font-size: 19px; color: var(--lav-ink); margin-bottom: 14px; letter-spacing: -.02em; }
.navbtn { width: 68px; height: 68px; border-radius: 18px; border: none; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; }
.navbtn[aria-current="page"] { background: var(--lav); color: #2E2A47; }
.navbtn.logout { margin-top: auto; height: 56px; }
.main { flex: 1; min-width: 0; overflow: auto; padding: 24px 28px; }
.page-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { font-size: 28px; font-weight: 800; letter-spacing: -.02em; flex: 1; min-width: 160px; }
.sub { font-size: 13px; color: var(--muted); }

.btn { height: 46px; padding: 0 18px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
.btn.primary { border: none; background: var(--lav); color: #2E2A47; font-weight: 700; }
.btn.pink { border: none; background: var(--pink); color: var(--pink-ink); }
.btn.ghost-danger { color: var(--pink-ink); }
.btn.sm { height: 36px; padding: 0 12px; border-radius: 10px; font-size: 13px; }
.iconbtn { width: 46px; height: 46px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.chip { min-height: 38px; padding: 0 14px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2); font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--lav); background: var(--lav-soft); color: var(--lav-ink); font-weight: 700; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 10px; white-space: nowrap; }
.tag.가망 { background: var(--pink-soft); color: var(--pink-ink); }
.tag.상담예정 { background: var(--lav-soft); color: var(--lav-ink); }
.tag.계약 { background: var(--mint-soft); color: var(--mint-ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; min-width: 0; }
.card h2 { font-size: 16px; font-weight: 700; }
.example { font-size: 11px; font-weight: 700; color: var(--butter-ink); background: var(--butter-soft); padding: 2px 8px; border-radius: 8px; }

/* customers */
.search { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); width: 280px; max-width: 100%; }
.search input { border: none; outline: none; background: transparent; flex: 1; min-width: 0; }
.cgrid { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 18px; align-items: start; }
.clist { padding: 0; overflow: hidden; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 14px; border-bottom: 1px solid var(--line); }
.crow { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 14px; border: none; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; }
.crow[aria-current="true"] { background: var(--lav-soft); box-shadow: inset 4px 0 0 var(--lav); }
.avatar { width: 44px; height: 44px; border-radius: 22px; background: var(--lav-soft); color: var(--lav-ink); display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }
.avatar.lg { width: 60px; height: 60px; border-radius: 30px; font-size: 22px; background: var(--lav); color: #2E2A47; }
.crow .who { flex: 1; min-width: 0; }
.crow .nm { font-weight: 700; }
.crow .mt { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; max-width: 100%; }
.detail { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.dhead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.dhead .who { flex: 1; min-width: 180px; }
.dhead .nm { font-size: 22px; font-weight: 800; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.ichip { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 10px; background: var(--lav-soft); color: var(--lav-ink); }
.info { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-top: 14px; }
.info div { background: var(--bg); border-radius: 12px; padding: 8px 12px; min-width: 0; }
.info dt { font-size: 12px; color: var(--muted); }
.info dd { margin: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.info dd.empty { color: var(--faint); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.pol { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--bg); border-radius: 12px; }
.pol .k { flex: 1; min-width: 0; }
.pol .k b { display: block; }
.pol .k span { font-size: 13px; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.memo { display: flex; gap: 10px; }
.memo i { width: 10px; height: 10px; border-radius: 5px; background: var(--line); margin-top: 7px; flex-shrink: 0; }
.memo.next i { background: var(--lav); }
.memo .d { font-size: 13px; color: var(--muted); }
.row-head { display: flex; align-items: center; gap: 8px; }
.row-head h2 { flex: 1; }
.empty-note { color: var(--muted); padding: 10px 0; }

/* coverage */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
.tile { border-radius: 16px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); }
.tile .l { font-size: 13px; color: var(--muted); }
.tile .v { font-size: 24px; font-weight: 800; }
.tile.bad { background: var(--pink-soft); border-color: transparent; }
.tile.bad .l, .tile.bad .v { color: var(--pink-ink); }
.tile.good { background: var(--mint-soft); border-color: transparent; }
.tile.good .l, .tile.good .v { color: var(--mint-ink); }
.covgrid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
.covtable { overflow-x: auto; }
.cv { display: grid; grid-template-columns: 96px minmax(60px, 1fr) 68px 68px 52px; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); min-width: 400px; }
.cv.h { font-size: 13px; color: var(--muted); font-weight: 600; }
.bar { height: 10px; border-radius: 5px; background: var(--sunken); overflow: hidden; }
.bar b { display: block; height: 100%; border-radius: 5px; }
.st { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 10px; text-align: center; }
.st.ok { background: var(--mint-soft); color: var(--mint-ink); }
.st.low { background: var(--butter-soft); color: var(--butter-ink); }
.st.none { background: var(--pink-soft); color: var(--pink-ink); }
textarea.field, input.field { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; outline: none; }
input.field { height: 48px; }
textarea.field { resize: vertical; min-height: 96px; }
.field.err { border-color: var(--pink-ink); }

/* login */
.login { display: flex; gap: 28px; height: 100%; padding-block: 28px; }
.hero { flex: 1; border-radius: 32px; background: linear-gradient(145deg, var(--pink) 0%, var(--lav-soft) 55%, var(--mint-soft) 100%); padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; min-width: 0; }
.hero h1 { font-size: 44px; font-weight: 800; letter-spacing: -.03em; line-height: 1.25; }
.hero p { font-size: 17px; color: var(--ink-2); margin: 10px 0 0; }
.fpside { width: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; text-align: center; }
.fp { width: 170px; height: 170px; border-radius: 85px; border: none; background: var(--lav-soft); color: var(--lav-ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 16px color-mix(in srgb, var(--lav-soft) 60%, transparent); transition: background .2s, color .2s; }
.fp.ok { background: var(--mint-soft); color: var(--mint-ink); }

/* modal + toast */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 40; }
.modal { width: 560px; max-width: 100%; max-height: calc(100% - 32px); overflow: auto; background: var(--surface); border-radius: 26px; padding: 26px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.modal h2 { font-size: 22px; font-weight: 800; }
.bhint { font-weight: 500; color: var(--lav-ink); font-size: 13px; }
.bhint.bad { color: var(--pink-ink); }
.lbl { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.frow { display: flex; gap: 10px; flex-wrap: wrap; }
.frow > * { flex: 1; min-width: 140px; }
.mfoot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 22px; border-radius: 22px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); }

/* Claude drawer */
.askfab { position: fixed; right: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); height: 58px; padding: 0 22px; border-radius: 29px; border: none; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); z-index: 30; }
.askfab .dot { width: 26px; height: 26px; border-radius: 13px; background: linear-gradient(135deg, var(--pink), var(--lav), var(--mint)); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 100%; background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; z-index: 50; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dr-head { display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.dr-head h2 { flex: 1; font-size: 18px; font-weight: 800; }
.dr-body { flex: 1; overflow: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.bubble { max-width: 92%; padding: 11px 14px; border-radius: 16px; white-space: pre-wrap; word-break: break-word; }
.bubble.me { align-self: flex-end; background: var(--lav); color: #2E2A47; border-bottom-right-radius: 6px; }
.bubble.ai { align-self: flex-start; background: var(--sunken); border-bottom-left-radius: 6px; }
.bubble.ai.err { background: var(--pink-soft); color: var(--pink-ink); }
.bubble .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.status { font-size: 13px; color: var(--muted); align-self: flex-start; }
.suggest { display: flex; flex-direction: column; gap: 8px; }
.suggest button { text-align: left; padding: 10px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); }
.dr-foot { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
.dr-foot textarea { flex: 1; min-width: 0; resize: none; height: 48px; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; background: var(--bg); outline: none; }


/* study */
.shero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-bottom: 16px; }
.lvcard { background: linear-gradient(135deg, var(--pink) 0%, var(--lav-soft) 60%, var(--mint-soft) 100%); border: none; }
.lv { display: flex; align-items: center; gap: 14px; }
.lvbadge { width: 64px; height: 64px; border-radius: 20px; background: var(--surface); color: var(--lav-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; line-height: 1.1; flex-shrink: 0; }
.lvbadge small { font-size: 11px; font-weight: 700; color: var(--muted); }
.xpbar { height: 12px; border-radius: 6px; background: color-mix(in srgb, var(--surface) 70%, transparent); overflow: hidden; margin-top: 10px; }
.xpbar b { display: block; height: 100%; border-radius: 6px; background: var(--lav-ink); transition: width .6s; }
.bigstat { display: flex; align-items: center; gap: 14px; }
.bigstat .v { font-size: 30px; font-weight: 800; line-height: 1; }
.flame { color: #E8784F; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 16px; }
.mode { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; min-height: 132px; transition: transform .15s; }
.mode:hover { transform: translateY(-2px); }
.mode .t { font-size: 18px; font-weight: 800; }
.mode .d { font-size: 14px; color: var(--muted); flex: 1; }
.mode .go { font-size: 13px; font-weight: 700; }
.mode.m1 { background: var(--lav-soft); border-color: transparent; } .mode.m1 .go { color: var(--lav-ink); }
.mode.m2 { background: var(--butter-soft); border-color: transparent; } .mode.m2 .go { color: var(--butter-ink); }
.mode.m3 { background: var(--pink-soft); border-color: transparent; } .mode.m3 .go { color: var(--pink-ink); }
.mode[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 12px; }
.bdg { border-radius: 16px; padding: 12px; text-align: center; background: var(--sunken); color: var(--faint); }
.bdg .ic { width: 44px; height: 44px; border-radius: 22px; margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; background: var(--line); }
.bdg b { display: block; font-size: 13px; }
.bdg span { font-size: 11px; }
.bdg.on { background: var(--mint-soft); color: var(--mint-ink); }
.bdg.on .ic { background: var(--mint); color: #1F4D3C; }
.qwrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.qtop { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.qprog { flex: 1; min-width: 120px; height: 10px; border-radius: 5px; background: var(--sunken); overflow: hidden; }
.qprog b { display: block; height: 100%; background: var(--lav); border-radius: 5px; transition: width .3s; }
.combo { padding: 6px 12px; border-radius: 14px; background: var(--butter-soft); color: var(--butter-ink); font-weight: 800; font-size: 14px; }
.combo.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
.timer { font-size: 28px; font-weight: 800; color: var(--pink-ink); min-width: 70px; text-align: right; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 26px; display: flex; flex-direction: column; gap: 16px; }
.qcard h2 { font-size: 22px; font-weight: 700; line-height: 1.55; }
.opt { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 10px 18px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); text-align: left; font-size: 17px; width: 100%; }
.opt .n { width: 32px; height: 32px; border-radius: 16px; background: var(--sunken); display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; font-size: 15px; }
.opt.right { border-color: var(--mint); background: var(--mint-soft); } .opt.right .n { background: var(--mint); color: #1F4D3C; }
.opt.wrong { border-color: var(--pink-ink); background: var(--pink-soft); } .opt.wrong .n { background: var(--pink-ink); color: var(--surface); }
.opt.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.exp { border-radius: 16px; padding: 14px 18px; background: var(--bg); line-height: 1.65; }
.gain { font-weight: 800; color: var(--lav-ink); }
.result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.result .score { font-size: 64px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.ring { transform: rotate(-90deg); }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 70; }
@media (max-width: 1000px) { .shero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .shero .lvcard { grid-column: 1 / -1; } }
@media (max-width: 760px) { .qcard { padding: 18px; } .qcard h2 { font-size: 19px; } .opt { font-size: 16px; } }
@media (prefers-reduced-motion: reduce) { .combo.pop, .opt.shake { animation: none; } }

.navbtn.ai .dot { width: 26px; height: 26px; border-radius: 13px; background: linear-gradient(135deg, var(--pink), var(--lav), var(--mint)); }
.navbtn.ai[aria-expanded="true"] { background: var(--ink); color: var(--bg); }

/* one-screen customer layout */
.main.fit { display: flex; flex-direction: column; overflow: hidden; padding-block: 20px; }
.main.fit .page-head { margin-bottom: 14px; flex-shrink: 0; }
.main.fit .cgrid { flex: 1; min-height: 0; align-items: stretch; }
.main.fit .clist { display: flex; flex-direction: column; min-height: 0; }
.main.fit #rows { flex: 1; min-height: 0; overflow: auto; }
.main.fit .detail { min-height: 0; }
.main.fit .detail > .card:first-child { flex-shrink: 0; padding: 16px 18px; }
.main.fit .detail .two { flex: 1; min-height: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.main.fit .detail .two > .card { overflow: auto; min-height: 0; }
.main.fit .info { margin-top: 12px; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.main.fit .info div { padding: 6px 10px; }
.main.fit .info dd { font-size: 14px; }

            ${docs ? `<div class="dgrid">${docs}</div>` : '<p class="empty-note" style="flex:1">아직 올린 증권이 없어요. 촬영하면 여러 장이 한 묶음으로 정리돼요.</p>'}
            <div class="upbtns">
              <button class="up1" data-a="camopen">${I.cam}촬영</button>
              <label class="up2">${I.file}사진·PDF<input type="file" id="upfile" accept="image/*,application/pdf" multiple></label>
            </div>
          </section>
        </div>`}
      </div>`;
  }

  // ---------- documents: stored on this device (IndexedDB) ----------
  const mem = new Map(); const urls = new Map(); const pending = new Set();
  let dbp = null;
  const idb = () => { if (dbp) return dbp; dbp = new Promise((res) => { try { const r = indexedDB.open('seolgye-files', 1); r.onupgradeneeded = () => r.result.createObjectStore('blobs'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); } }); return dbp; };
  const putBlob = async (id, blob) => { mem.set(id, blob); urls.set(id, URL.createObjectURL(blob)); try { const d = await idb(); if (d) d.transaction('blobs', 'readwrite').objectStore('blobs').put(blob, id); } catch (e) {} };
  const getBlob = async (id) => { if (mem.has(id)) return mem.get(id); try { const d = await idb(); if (!d) return null; return await new Promise((res) => { const r = d.transaction('blobs').objectStore('blobs').get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); } catch (e) { return null; } };
  const delBlob = async (id) => { mem.delete(id); if (urls.has(id)) { URL.revokeObjectURL(urls.get(id)); urls.delete(id); } try { const d = await idb(); if (d) d.transaction('blobs', 'readwrite').objectStore('blobs').delete(id); } catch (e) {} };
  let rsoon = 0;
  const renderSoon = () => { if (rsoon) return; rsoon = requestAnimationFrame(() => { rsoon = 0; if (document.activeElement && ['proposal', 'upfile'].includes(document.activeElement.id)) return; render(); }); };
  function blobURL(id) {
    if (!id) return '';
    if (urls.has(id)) return urls.get(id);
    if (!pending.has(id)) { pending.add(id); getBlob(id).then((b) => { pending.delete(id); if (b) { mem.set(id, b); urls.set(id, URL.createObjectURL(b)); renderSoon(); } }); }
    return '';
  }

  function camView() {
    const shots = S.cam.shots;
    const last = shots.length ? blobURL(shots[shots.length - 1]) : '';
    const kinds = ['종신보험', '실손보험', '암보험', '건강보험', '연금보험', '자동차보험', '기타'];
    return `<div class="cam" role="dialog" aria-modal="true" aria-label="증권 촬영">
      <div class="top">
        <button class="iconbtn" data-a="camcancel" aria-label="촬영 취소">${I.x}</button>
        <div style="flex:1"><div style="font-size:19px;font-weight:800">${esc(sel().name)} 님 증권 촬영</div><div style="font-size:14px;color:#C9C2E8">셔터를 한 번 누를 때마다 한 장씩 찍혀요</div></div>
        <span style="padding:8px 14px;border-radius:18px;background:rgba(201,184,255,.2);color:#E4DBFF;font-weight:700">${shots.length}장 찍음</span>

      <div class="stage">
        ${last ? `<img src="${last}" alt="방금 찍은 사진">` : `<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px">${I.camBig}<div style="font-size:18px;font-weight:600">아래 셔터를 누르면 카메라가 열려요</div><div style="font-size:15px">한 장 찍으면 여기로 돌아와요. 다음 장도 셔터를 누르면 돼요.</div></div>`}
        ${S.cam.flash ? `<div class="flash">${shots.length}번째 장 저장됨</div>` : ''}
      </div>
      <div class="bottom">
        <div class="strip">${shots.map((id, k) => `<div class="shot"><img src="${blobURL(id)}" alt="${k + 1}번째 장"><span class="no">${k + 1}</span><button class="x" data-a="camdel" data-v="${id}" aria-label="${k + 1}번째 장 지우기">${I.xs}</button></div>`).join('') || '<span style="color:#A39DBF;align-self:center;font-size:14px">찍은 사진이 여기 쌓여요</span>'}</div>
        <label class="shutter" aria-label="셔터 · 한 장 찍기"><input type="file" id="shot" accept="image/*" capture="environment"></label>
        <div class="side"><button class="done" data-a="camdone" ${shots.length ? '' : 'disabled'}>완료 · 묶음 만들기</button></div>
      </div>
      ${S.cam.step === 'name' ? `<div class="scrim" style="z-index:56"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="bn-title" style="color:var(--ink)">
        <div style="display:flex;align-items:center;gap:14px"><img src="${blobURL(shots[0])}" alt="" style="width:52px;height:68px;object-fit:cover;border-radius:10px;box-shadow:4px 4px 0 var(--lav-soft),8px 8px 0 var(--sunken)"><div><h2 id="bn-title">어떤 증권인가요?</h2><p class="sub" style="margin:2px 0 0;font-size:15px">찍은 ${shots.length}장을 한 묶음으로 저장해요</p></div></div>
        <div class="chips" style="margin:0">${kinds.map((k) => `<button class="chip" data-a="camkind" data-v="${k}" aria-pressed="${S.cam.kind === k}">${k}</button>`).join('')}</div>
        <label class="lbl">보험사 <span class="sub" style="font-weight:400">(선택)</span><input class="field" id="bn-co" value="${esc(S.cam.co || '')}" placeholder="예: ○○생명"></label>
        <div class="mfoot"><button class="btn" data-a="cammore">더 찍기</button><button class="btn primary" data-a="camsave">저장</button></div>
      </div></div>` : ''}

  }

  function viewerView() {
    const c = sel(); const d = (c && c.docs || []).find((x) => x.id === S.viewDoc); if (!d) return '';
    const pages = d.type === 'bundle' ? d.pages : [d.blob];

    if (d.type === 'pdf') { const u = blobURL(d.blob); body = `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center"><span class="pdfbadge" style="font-size:22px;padding:24px 20px">PDF</span><div>${esc(d.name)}</div>${u && !IS_APP ? `<a class="btn pink" href="${u}" target="_blank" rel="noopener">새 창에서 열기</a>` : ''}<p class="sub">새 창에서 열리지 않으면 탭의 파일 앱에서 원본을 열어 주세요.</p></div>`; }

  // ---------- render: overlays ----------
  // ---------- sample customers ----------
  const SEED_IDS = ['c1', 'c2', 'c3', 'c4', 'c5', 'c6'];
  const hasSeed = () => S.customers.some((c) => SEED_IDS.includes(c.id));
  // ---------- Claude 앱에 물어보기 ----------
  const ASK_ONE = [
    { k: 'cover', t: '보장 분석', d: '부족한 보장과 우선순위' },
    { k: 'prep', t: '다음 상담 준비', d: '지난 기록 요약, 할 말, 예상 질문' },
    { k: 'msg', t: '제안 문자 초안', d: '카톡으로 보낼 안부·제안 메시지' },
    { k: 'easy', t: '쉽게 설명하기', d: '관심 보장을 고객 눈높이로' },
    { k: 'free', t: '직접 질문', d: '아래 칸에 물어볼 말을 적어요' }
  ];
  const ASK_ALL = [
    { k: 'week', t: '이번 주 연락 순서', d: '누구부터 연락할지와 이유' },
    { k: 'status', t: '고객 현황 정리', d: '단계별 요약과 다음 할 일' },
    { k: 'free', t: '직접 질문', d: '아래 칸에 물어볼 말을 적어요' }
  ];
  function custBlock(c) {
    const a = ageOf(c);
    const rows = covRows(c).map((r) => `- ${r.item}: 현재 ${r.curTxt} / 목표 ${r.goalTxt} (${r.stTxt})`).join('\n');
    const memos = (c.memos || []).slice(0, 6).map((m) => `- ${m.date}${m.next ? ' (예정)' : ''}: ${m.text}`).join('\n');
    return `[고객] ${c.name} / ${a !== '' ? a + '세' : '나이 미입력'} ${c.gender ? c.gender + '성' : ''} / 직업 ${c.job || '미입력'} / 사는 곳 ${c.area || '미입력'} / 진행 상태 ${c.tag}
[관심 보장] ${(c.interests || []).join(', ') || '없음'}
[가입 보험] ${(c.policies || []).map((p) => p.kind + (p.year ? '(' + p.year + '년)' : '')).join(', ') || '없음'}
[보장분석]
${rows || '- 없음'}
[상담 기록]
${memos || '- 없음'}
[제안 메모] ${c.proposal || '없음'}`;
  }
  function allBlock() {
    return S.customers.slice(0, 60).map((c) => {
      const a = ageOf(c); const miss = covRows(c).filter((r) => r.s !== 'ok').map((r) => r.item);
      const next = (c.memos || []).filter((m) => m.next).sort((x, y) => (x.date < y.date ? -1 : 1))[0];
      const last = (c.memos || []).filter((m) => !m.next).sort((x, y) => (x.date < y.date ? 1 : -1))[0];
      return `- ${c.name} (${a !== '' ? a + '세' : '나이 모름'}, ${c.tag}) 관심: ${(c.interests || []).join('·') || '없음'} / 부족: ${miss.join('·') || '없음'} / 예정: ${next ? next.date + ' ' + next.text : '없음'} / 최근: ${last ? last.date + ' ' + last.text : '없음'}`;
    }).join('\n');
  }
  function askPrompt() {
    const q = S.ask; const extra = (q.extra || '').trim();
    const head = `나는 보험설계사를 막 시작했어. 쉬운 말로, 짧게 정리해 줘. 확실하지 않은 건 추측이라고 표시하고, 특정 상품 가입을 단정해서 권하지는 마. 오늘은 ${iso(today)}이야.`;
    const more = extra ? `\n\n[덧붙이는 말]\n${extra}` : '';
    if (q.who === 'all') {
      const ask = { week: '아래 고객 목록을 보고 이번 주에 누구부터 연락하면 좋을지 순서대로 5명 이내로 골라 줘. 사람마다 이유 한 줄과 연락할 때 첫마디 예시를 붙여 줘.',
        status: '아래 고객 목록을 가망 / 상담 예정 / 계약 단계별로 요약하고, 단계마다 다음에 할 일을 2~3개씩 정리해 줘.',
        free: extra || '아래 고객 목록을 보고 내가 신경 써야 할 점을 알려 줘.' }[q.kind];
      return `${head}\n\n${ask}\n\n[고객 목록]\n${allBlock()}${q.kind === 'free' ? '' : more}`;
    }
    const c = S.customers.find((x) => x.id === q.cid); if (!c) return '';
    const ask = { cover: '아래 고객의 보장분석을 보고 부족한 보장을 우선순위대로 정리해 줘. 항목마다 왜 필요한지 한두 줄로 설명해 줘.',
      prep: '아래 고객과 다음 상담을 준비하려고 해. 지난 기록을 세 줄로 요약하고, 이번 상담에서 할 말 순서와 고객이 할 만한 질문 3개와 답변 예시를 정리해 줘.',

      easy: '아래 고객의 관심 보장을 보험을 잘 모르는 사람도 이해하게 쉽게 설명해 줘. 비유를 하나씩 들어 주고, 고객 상황에 맞춰 말해 줘.',
      free: extra || '아래 고객에 대해 내가 알아 두면 좋을 점을 알려 줘.' }[q.kind];

    if (S.modal === 'memo') h += memoModal();
    if (S.modal === 'del') h += delModal();

  const TAGS = ['가망', '상담 예정', '계약'];

  function formModal() {

  async function ask(text) {
    text = text.trim();
    if (!text || S.busy || !S.sample) return;
    S.chat.push({ role: 'user', content: text });
    S.busy = true; S.status = '생각하는 중…';
    const ai = { role: 'assistant', content: '' };
    renderLayer();
    const ctl = new AbortController(); S.ctl = ctl;
    const turns = S.chat.filter((m) => !m.err && m.content).slice(-12).map((m) => ({ role: m.role, content: m.content }));
    const opened = new Set();
    const tools = TOOLS().map((t) => ({ ...t, execute: (inp, ctx) => { if (['get_customer', 'show_customer'].includes(t.name) && inp && inp.id) opened.add(String(inp.id)); return t.execute(inp, ctx); } }));
    try {
      const opts = { signal: ctl.signal, onText: ({ text }) => { ai.content = text; if (!S.chat.includes(ai)) S.chat.push(ai); S.status = ''; renderLayer(); } };
      if (S.sampleTools) opts.tools = tools; else opts.cache = false;
      const input = [{ role: 'user', content: RULES() + (S.sampleTools ? '' : '\n\n(도구를 쓸 수 없어 전체 데이터를 붙임)\n' + JSON.stringify(S.customers).slice(0, 40000)) }, ...turns];
      const res = await S.sample(input, opts);
      ai.content = res.text; if (!S.chat.includes(ai)) S.chat.push(ai);
      const ids = [...opened].filter((id) => S.customers.some((c) => c.id === id));
      if (ids.length) ai.open = ids.map((id) => ({ id, name: S.customers.find((c) => c.id === id).name }));
    } catch (e) {
      const code = e && e.code;
      if (e && e.text) { ai.content = e.text; if (!S.chat.includes(ai)) S.chat.push(ai); }
      if (code !== 'cancelled') S.chat.push({ role: 'assistant', content: ERR[code] || '연결이 끊겼어요. 다시 물어봐 주세요.', err: true });
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled'].includes(code)) { S.sample = null; }
    } finally {
      S.busy = false; S.status = ''; S.ctl = null; render();
      const inp = layer.querySelector('#ai-in'); if (inp) inp.focus();
    }
  }

  (async () => {
    try {
      const sample = await (window.claude && window.claude.use ? window.claude.use('sample') : null);
      if (!sample) return;
      S.sample = sample;
      const lim = await sample.limits().catch(() => null);
      S.sampleTools = !!(lim && lim.tools);
      render();
    } catch (e) {}
  })();

  function confetti(n = 80) {

    const ctx = fx.getContext('2d'); fx.width = innerWidth; fx.height = innerHeight;
    const cols = ['#FFB3C8', '#C9B8FF', '#A8E0CC', '#FFCB7A', '#B3D4FF'];
    const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2 + (Math.random() - .5) * 200, y: innerHeight * .45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: Math.random() * 6 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, life: 0 }));
    let f = 0;
    (function tick() {
      ctx.clearRect(0, 0, fx.width, fx.height);
      ps.forEach((p) => { p.vy += .45; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 3, p.r, p.r / 1.6); ctx.restore(); });
      if (++f < 90) requestAnimationFrame(tick); else ctx.clearRect(0, 0, fx.width, fx.height);
    })();
  }
